spring:
  application:
    name: studenthub-backend
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studenthub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application Configuration
app:
  jwt:
    # 512-bit HS512 secret key generated dynamically or provided in env
    secret: ${JWT_SECRET:9a4f2c8d3e7b1a6c5d8e7f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
  
  upload:
    dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.studenthub: DEBUG
